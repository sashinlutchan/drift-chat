# The whole Drift stack on one machine (spec section 25): infrastructure, the four services, the frontend, the edge
# nginx and the observability stack. Everything is served over plain HTTP: no certificates.
#   App:     http://localhost:8080   (nginx)        Grafana: http://localhost:3000
#
# scripts/deploy.sh brings this up for you. It starts the infrastructure first, creates the databases, the Kafka topics
# and the MinIO buckets, and then starts the services. Run by hand only after that setup has been done once.
#
# Each backend service loads its own backend/<service>/.env (env_file); the settings that differ inside Docker
# (hostnames) are overridden below. Infrastructure credentials come from the .env in this folder. Image tags are pinned;
# MinIO by digest because its official image is no longer published. Every image is built from this folder.

name: drift

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp"]

x-common-env: &common-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DATABASE_USERNAME: ${POSTGRES_USER:-drift}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

x-health: &health
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${MANAGEMENT_PORT}/actuator/health/readiness | grep -q UP"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 40s

services:
  # ── infrastructure ────────────────────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  valkey:
    image: valkey/valkey:9.0.0-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-drift-local-key:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      # Leftover parts of abandoned multipart uploads are removed after this long (spec section 13.6)
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO console
    healthcheck:
      # the image has bash but no curl or wget, so speak HTTP over bash's /dev/tcp
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ "$$line" == *200* ]]'
      interval: 5s
      timeout: 3s
      retries: 20

  # ── backend services ──────────────────────────────────────────────────────────────────────────────────────────
  user-service:
    <<: *hardening
    build: { context: ., dockerfile: backend/user-service/Dockerfile }
    image: drift/user-service:${DRIFT_TAG:-local}
    env_file:
      - path: backend/user-service/.env
        required: false
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/users_db
      VALKEY_HOST: valkey
      FILE_SERVICE_ADDR: file-service:9084
    depends_on: &backend-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck: *health

  room-service:
    <<: *hardening
    build: { context: ., dockerfile: backend/room-service/Dockerfile }
    image: drift/room-service:${DRIFT_TAG:-local}
    env_file:
      - path: backend/room-service/.env
        required: false
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/rooms_db
      USER_SERVICE_ADDR: user-service:9081
      PUBLIC_BASE_URL: http://localhost:${EDGE_PORT:-8080}
    depends_on: *backend-deps
    healthcheck: *health

  file-service:
    <<: *hardening
    build: { context: ., dockerfile: backend/file-service/Dockerfile }
    image: drift/file-service:${DRIFT_TAG:-local}
    env_file:
      - path: backend/file-service/.env
        required: false
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/files_db
      MINIO_ENDPOINT: http://minio:9000
      ROOM_SERVICE_ADDR: room-service:9082
    depends_on:
      <<: *backend-deps
      minio: { condition: service_healthy }
    healthcheck: *health

  message-service:
    <<: *hardening
    build: { context: ., dockerfile: backend/message-service/Dockerfile }
    image: drift/message-service:${DRIFT_TAG:-local}
    env_file:
      - path: backend/message-service/.env
        required: false
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/messages_db
      VALKEY_HOST: valkey
      USER_SERVICE_ADDR: user-service:9081
      ROOM_SERVICE_ADDR: room-service:9082
      FILE_SERVICE_ADDR: file-service:9084
      ALLOWED_ORIGINS: http://localhost:${EDGE_PORT:-8080}
    depends_on: *backend-deps
    healthcheck: *health

  frontend:
    build: { context: ., dockerfile: frontend/drift-chat/Dockerfile }
    image: drift/frontend:${DRIFT_TAG:-local}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # ── edge ──────────────────────────────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      user-service: { condition: service_healthy }
      room-service: { condition: service_healthy }
      message-service: { condition: service_healthy }
      file-service: { condition: service_healthy }
      frontend: { condition: service_started }
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── observability (spec section 26) ───────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.6.0
    restart: unless-stopped
    user: "0"   # the data volume is created owned by root, and Loki would otherwise run as an unprivileged user
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo

  # Collects container logs (to Loki) and receives OTLP traces from the services (to Tempo)
  alloy:
    image: grafana/alloy:v1.11.0
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki, tempo]

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki, tempo]

volumes:
  pgdata:
  kafkadata:
  miniodata:
  promdata:
  lokidata:
  tempodata:
  grafanadata:
