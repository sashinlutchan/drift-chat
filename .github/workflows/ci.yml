name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, room-service, message-service, file-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"

      - name: Test
        working-directory: backend/${{ matrix.service }}
        run: |
          chmod +x ./gradlew
          ./gradlew check --console=plain

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/drift-chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/drift-chat/yarn.lock

      - name: Install and build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

  images:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: user-service
            dockerfile: backend/user-service/Dockerfile
          - image: room-service
            dockerfile: backend/room-service/Dockerfile
          - image: message-service
            dockerfile: backend/message-service/Dockerfile
          - image: file-service
            dockerfile: backend/file-service/Dockerfile
          - image: frontend
            dockerfile: frontend/drift-chat/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t drift/${{ matrix.image }}:local .
