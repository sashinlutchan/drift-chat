# Edge nginx (spec section 13.5): the only door into the stack, served over plain HTTP (no certificates).
# Routing of APIs / files / sockets / frontend, upload streaming, rate limits, security headers.
# Cookies and Set-Cookie pass through untouched on every route, including the WebSocket upgrade.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # One JSON object per line so Loki can index the fields
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"request_time":$request_time,"upstream":"$upstream_addr","request_id":"$request_id"}';
    access_log /dev/stdout json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting: sign-up is limited per IP (only POST counts), the API in general more loosely
    map $request_method $signup_key {
        POST    $binary_remote_addr;
        default '';
    }
    limit_req_zone $signup_key          zone=signup:10m rate=6r/m;
    limit_req_zone $binary_remote_addr  zone=api:10m    rate=30r/s;
    limit_req_status 429;

    upstream user_service    { server user-service:8081; keepalive 16; }
    upstream room_service    { server room-service:8082; keepalive 16; }
    upstream message_service { server message-service:8083; keepalive 16; }
    upstream message_socket  { server message-service:8090; }
    upstream file_service    { server file-service:8084; keepalive 16; }
    upstream frontend        { server frontend:8080; keepalive 8; }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    server {
        listen 80 default_server;
        server_name _;

        # Security headers on every response (spec section 13.5)
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        client_max_body_size 1m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ── APIs (the /api/v1 prefix is removed; services serve /users, /rooms, ...) ──────────────────────────────
        location /api/v1/users {
            limit_req zone=signup burst=3 nodelay;
            limit_req zone=api burst=60 nodelay;
            client_max_body_size 6m;                # a 5 MB avatar plus form fields
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://user_service;
        }

        location /api/v1/rooms {
            limit_req zone=api burst=60 nodelay;
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://room_service;
        }

        # Chunked uploads of up to 1 GB: one chunk per request, streamed through without buffering to disk
        location ~ ^/api/v1/messages/uploads/[^/]+/chunks/ {
            limit_req zone=api burst=60 nodelay;
            client_max_body_size 9m;                # UPLOAD_CHUNK_SIZE (8 MB) plus headroom
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://message_service;
        }

        location /api/v1/messages {
            limit_req zone=api burst=60 nodelay;
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://message_service;
        }

        # Files stream with HTTP Range support so audio/video can seek; Range and If-Range pass through
        location /api/v1/files {
            proxy_buffering off;
            proxy_read_timeout 3600s;
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://file_service;
        }

        # ── Socket.IO (WebSocket only): upgrade headers and long timeouts ─────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://message_socket;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ── Frontend (also serves share links /r/<slug> as client-side routes) ────────────────────────────────────
        location / {
            proxy_pass http://frontend;
        }
    }
}
