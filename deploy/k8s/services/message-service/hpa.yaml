apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-service
  namespace: drift
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: message-service }
  # Two replicas are the floor so cross-pod fan-out is always exercised (spec section 25)
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
