# The observability stack in the "observability" namespace (spec sections 25 and 26). Data lives in emptyDir volumes:
# this is a local stack, and metrics, logs and traces are cheap to lose.
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: observability }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: drift-observability-read }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, nodes, services, endpoints, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: drift-observability-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: drift-observability-read }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: observability }
  - { kind: ServiceAccount, name: alloy, namespace: observability }
---
apiVersion: v1
kind: Secret
metadata: { name: grafana-secret, namespace: observability }
type: Opaque
stringData:
  # LOCAL DEVELOPMENT login, same as deploy .env.example
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin-change-me
---
# ── Prometheus ─────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d", "--storage.tsdb.path=/data"]
          ports: [{ containerPort: 9090, name: http }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 768Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /data }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: observability }
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
# ── Loki ───────────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: loki
          image: grafana/loki:3.6.0
          args: ["-config.file=/etc/loki/loki.yml"]
          ports: [{ containerPort: 3100, name: http }]
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - { name: config, configMap: { name: loki-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: observability }
spec:
  selector: { app: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
---
# ── Tempo ──────────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: tempo, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: tempo } }
  template:
    metadata: { labels: { app: tempo } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: tempo
          image: grafana/tempo:2.8.2
          args: ["-config.file=/etc/tempo/tempo.yml"]
          ports:
            - { containerPort: 3200, name: http }
            - { containerPort: 4317, name: otlp-grpc }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - { name: config, configMap: { name: tempo-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: tempo, namespace: observability }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
# ── Alloy ──────────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: alloy, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: alloy } }
  template:
    metadata: { labels: { app: alloy } }
    spec:
      serviceAccountName: alloy
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: alloy
          image: grafana/alloy:v1.11.0
          args: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/tmp/alloy", "/etc/alloy/config.alloy"]
          ports:
            - { containerPort: 12345, name: http }
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: alloy-config } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: alloy, namespace: observability }
spec:
  selector: { app: alloy }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
# ── Grafana ────────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          ports: [{ containerPort: 3000, name: http }]
          envFrom: [{ secretRef: { name: grafana-secret } }]
          env:
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: observability }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
