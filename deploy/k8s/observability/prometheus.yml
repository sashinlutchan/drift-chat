# Prometheus in Kubernetes (spec section 26): finds every service pod by its "management" port and scrapes
# /actuator/prometheus. The management port is not in any Service and never leaves the cluster.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: drift-services
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [drift] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: management
        action: keep
      # dashboards select services by the "job" label, same as in Docker Compose
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["minio.drift:9000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
