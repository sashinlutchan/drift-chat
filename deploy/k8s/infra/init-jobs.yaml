# One-off setup (spec section 25): the four databases, the Kafka topics and the MinIO buckets. Every step is safe to
# repeat, and each job waits for its dependency to be ready first.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: drift
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:18.0-alpine
          envFrom: [{ secretRef: { name: postgres-secret } }]
          command:
            - sh
            - -c
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              until pg_isready -h postgres -U "$POSTGRES_USER" -d postgres; do sleep 2; done
              for db in users_db rooms_db messages_db files_db; do
                if [ "$(psql -h postgres -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'")" != "1" ]; then
                  psql -h postgres -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db OWNER $POSTGRES_USER"
                fi
              done
              echo "databases ready"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: drift
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: apache/kafka:4.1.0
          command:
            - sh
            - -c
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; do sleep 3; done
              for topic in user.deleted user.updated presence.changed room.created room.updated room.deleted member.joined member.left room.occupancy message.created; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
              done
              echo "topics ready"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: drift
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: chainguard/minio-client@sha256:be51ef820151a708a8e140037e3746862a8c1dd5e624f84b404a1d71bcefb167
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_PASSWORD } }
            # MC_HOST_<alias> configures the client without a shell
            - name: MC_HOST_local
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio:9000
          args: ["mb", "--ignore-existing", "local/drift-avatars", "local/drift-media"]
