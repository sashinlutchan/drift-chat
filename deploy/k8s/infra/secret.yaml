# Credentials for the infrastructure (spec section 25). These are LOCAL DEVELOPMENT values that match the .env.example
# files; change them together with the service .env files. The services' own ConfigMaps and Secrets are generated by
# scripts/deploy.sh from each backend/<service>/.env, so nothing about them lives in git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: drift
type: Opaque
stringData:
  POSTGRES_USER: drift
  POSTGRES_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: drift
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: change-me
  # "key-name:base64 of 32 bytes" — turns on server-side encryption at rest
  MINIO_KMS_SECRET_KEY: drift-local-key:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
