apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: drift
spec:
  selector: { app: valkey }
  ports: [{ name: valkey, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: drift
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0.0-alpine
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379, name: valkey }]
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
