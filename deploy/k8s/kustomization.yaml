# Everything in the cluster except the Ingress (which deploy.sh generates for the minikube IP) and the per-service
# ConfigMaps and Secrets (which deploy.sh generates from each backend/<service>/.env).
# Build it with: kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s
# (the observability configs are shared with the Docker Compose stack, which is why files outside this folder are read)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces/namespaces.yaml
  # infrastructure first: StatefulSets, credentials, then the one-off init jobs
  - infra/secret.yaml
  - infra/postgres.yaml
  - infra/kafka.yaml
  - infra/valkey.yaml
  - infra/minio.yaml
  - infra/init-jobs.yaml
  # services and frontend
  - services/user-service/deployment.yaml
  - services/user-service/service.yaml
  - services/room-service/deployment.yaml
  - services/room-service/service.yaml
  - services/file-service/deployment.yaml
  - services/file-service/service.yaml
  - services/message-service/deployment.yaml
  - services/message-service/service.yaml
  - services/message-service/hpa.yaml
  - frontend/frontend.yaml
  # observability
  - observability/observability.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: prometheus-config
    namespace: observability
    files: [prometheus.yml=observability/prometheus.yml]
  - name: loki-config
    namespace: observability
    files: [loki.yml=../observability/loki/loki.yml]
  - name: tempo-config
    namespace: observability
    files: [tempo.yml=../observability/tempo/tempo.yml]
  - name: alloy-config
    namespace: observability
    files: [config.alloy=observability/alloy.alloy]
  - name: grafana-datasources
    namespace: observability
    files: [datasources.yml=../observability/grafana/provisioning/datasources/datasources.yml]
  - name: grafana-dashboard-provider
    namespace: observability
    files: [dashboards.yml=../observability/grafana/provisioning/dashboards/dashboards.yml]
  - name: grafana-dashboards
    namespace: observability
    files:
      - ../observability/grafana/dashboards/drift-overview.json
      - ../observability/grafana/dashboards/drift-realtime.json
      - ../observability/grafana/dashboards/drift-storage.json
      - ../observability/grafana/dashboards/drift-cleanup.json
      - ../observability/grafana/dashboards/drift-kafka.json
      - ../observability/grafana/dashboards/drift-jvm.json
