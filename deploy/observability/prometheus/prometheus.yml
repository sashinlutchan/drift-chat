# Prometheus (spec section 26): scrapes Micrometer metrics from /actuator/prometheus on every service's management
# port (never exposed outside the Docker network), plus MinIO and itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["user-service:8181"], labels: { service: user-service } }]
  - job_name: room-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["room-service:8182"], labels: { service: room-service } }]
  - job_name: message-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["message-service:8183"], labels: { service: message-service } }]
  - job_name: file-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["file-service:8184"], labels: { service: file-service } }]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["minio:9000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
