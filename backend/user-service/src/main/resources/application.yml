spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerSecurityAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  grpc:
    server:
      port: ${GRPC_PORT:9081}
      health:
        enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${DATABASE_USERNAME:admin-change-me}
    password: ${DATABASE_PASSWORD:admin-change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_AVATAR_SIZE:5MB}
      max-request-size: ${MAX_AVATAR_SIZE:5MB}

server:
  port: ${HTTP_PORT:8081}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8181}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,kafka
  health:
    kafka:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      add:
        service: ${SERVICE_NAME:user-service}

springdoc:
  api-docs:
    enabled: false

drift:
  jwt-secret: ${JWT_SECRET:test-secret-key-that-is-32-bytes-long!}
  session-cookie-name: ${SESSION_COOKIE_NAME:drift_session}
  cookie-secure: ${COOKIE_SECURE:true}
  session-ttl: ${SESSION_TTL:24h}
  presence-ttl: ${PRESENCE_TTL:60s}
  cleanup-interval: ${CLEANUP_INTERVAL:5m}
  max-avatar-size: ${MAX_AVATAR_SIZE:5MB}
  file-service-addr: ${FILE_SERVICE_ADDR:localhost:9084}
