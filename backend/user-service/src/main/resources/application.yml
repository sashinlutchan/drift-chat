spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${DATABASE_USERNAME:drift}
    password: ${DATABASE_PASSWORD:drift}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Token is read from the drift_session cookie (custom BearerTokenResolver)
          jwk-set-uri: unused://local-hs256
  servlet:
    multipart:
      max-file-size: ${MAX_AVATAR_SIZE:5MB}
      max-request-size: ${MAX_AVATAR_SIZE:5MB}

server:
  port: ${HTTP_PORT:8081}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8181}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  include:
    trace-id: true
    span-id: true

springdoc:
  api-docs:
    enabled: false

drift:
  jwt-secret: ${JWT_SECRET:test-secret-key-that-is-32-bytes-long!}
  session-cookie-name: ${SESSION_COOKIE_NAME:drift_session}
  cookie-secure: ${COOKIE_SECURE:true}
  session-ttl: ${SESSION_TTL:24h}
  presence-ttl: ${PRESENCE_TTL:60s}
  cleanup-interval: ${CLEANUP_INTERVAL:5m}
  max-avatar-size: ${MAX_AVATAR_SIZE:5MB}
  file-service-addr: ${FILE_SERVICE_ADDR:localhost:9084}
