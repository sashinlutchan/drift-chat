spring:
  application:
    name: message-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/messages_db}
    username: ${DATABASE_USERNAME:drift}
    password: ${DATABASE_PASSWORD:drift}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SERVICE_NAME:message-service}-${HOSTNAME:pod}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: unused://local-hs256
  servlet:
    multipart:
      # Limits sized to a chunk, not the whole file (spec 13.6)
      max-file-size: ${UPLOAD_CHUNK_SIZE:8MB}
      max-request-size: ${UPLOAD_CHUNK_SIZE:8MB}

server:
  port: ${HTTP_PORT:8083}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8183}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  include:
    trace-id: true
    span-id: true

drift:
  socket:
    port: ${SOCKET_PORT:8090}
    allowed-origins: ${ALLOWED_ORIGINS:https://localhost:8443}
