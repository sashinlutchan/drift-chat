spring:
  application:
    name: file-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # Spring gRPC would otherwise demand HTTP Basic / bearer credentials on every gRPC call. Service-to-service calls
      # stay on the private network and carry the user's JWT in metadata only where needed (JwtServerInterceptor).
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerSecurityAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  grpc:
    server:
      port: ${GRPC_PORT:9084}
      health:
        enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/files_db}
    username: ${DATABASE_USERNAME:drift}
    password: ${DATABASE_PASSWORD:drift}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: file-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${HTTP_PORT:8084}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8184}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka
  health:
    kafka:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        # metrics are scraped by Prometheus (/actuator/prometheus), not pushed
        enabled: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  # Spring Boot's built-in structured logging: one JSON object per line (Loki/Alloy friendly).
  # Trace and span ids from Micrometer Tracing are included automatically via MDC.
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      add:
        service: ${SERVICE_NAME:file-service}

drift:
  jwt-secret: ${JWT_SECRET:test-secret-key-that-is-32-bytes-long!}
  session-cookie-name: ${SESSION_COOKIE_NAME:drift_session}
  max-avatar-size: ${MAX_AVATAR_SIZE:5MB}
  room-service-addr: ${ROOM_SERVICE_ADDR:localhost:9082}
  storage:
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
    minio-bucket-avatars: ${MINIO_BUCKET_AVATARS:drift-avatars}
    minio-bucket-media: ${MINIO_BUCKET_MEDIA:drift-media}
    max-file-size: ${MAX_FILE_SIZE:1GB}
    allowed-mime-types: ${ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,audio/mpeg,audio/ogg,audio/wav,audio/webm,audio/mp4,video/mp4,video/webm}
