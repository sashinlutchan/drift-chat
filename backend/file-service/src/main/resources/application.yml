spring:
  application:
    name: file-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/files_db}
    username: ${DATABASE_USERNAME:drift}
    password: ${DATABASE_PASSWORD:drift}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: unused://local-hs256

server:
  port: ${HTTP_PORT:8084}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8184}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  include:
    trace-id: true
    span-id: true

drift:
  storage:
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
    minio-bucket-avatars: ${MINIO_BUCKET_AVATARS:drift-avatars}
    minio-bucket-media: ${MINIO_BUCKET_MEDIA:drift-media}
    minio-kms-secret-key: ${MINIO_KMS_SECRET_KEY:change-me-32-bytes-minimum-secret}
    max-file-size: ${MAX_FILE_SIZE:1GB}
    allowed-mime-types: ${ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,audio/mpeg,audio/ogg,audio/wav,audio/webm,video/mp4,video/webm}
