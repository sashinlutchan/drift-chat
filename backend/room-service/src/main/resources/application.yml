spring:
  application:
    name: room-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rooms_db}
    username: ${DATABASE_USERNAME:drift}
    password: ${DATABASE_PASSWORD:drift}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: unused://local-hs256

server:
  port: ${HTTP_PORT:8082}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8182}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  include:
    trace-id: true
    span-id: true
